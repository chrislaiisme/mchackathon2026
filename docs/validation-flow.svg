<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" width="1000" height="860" font-family="Microsoft JhengHei, PingFang TC, Noto Sans CJK TC, Noto Sans TC, sans-serif">

  <defs>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#db2777"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
  </defs>

<rect x="0" y="0" width="1000" height="860" fill="#ffffff"/>
<rect x="8" y="8" width="984" height="844" rx="18" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="500" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">模擬使用者驗證流程</text>
<text x="500" y="55" text-anchor="middle" font-size="12" fill="#64748b">〔建議〕開發／測試階段用來產生量化數字，不是 live demo 當場執行的系統元件</text>
<text x="500" y="73" text-anchor="middle" font-size="12" fill="#94a3b8">「系統本身」＝同一套 ENGINE 01–03；人設來自真實目標圖片，用 FashionCLIP 相似度衡量收斂效果</text>
<rect x="40" y="110" width="260" height="120" rx="14" fill="#ccfbf1" stroke="#0d9488" stroke-width="2" stroke-dasharray="5,4"/>
<text x="170" y="140" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f766e">目標圖片（Pinterest）</text>
<text x="170" y="164" text-anchor="middle" font-size="12" fill="#0f766e">Vision 模型生成</text>
<text x="170" y="184" text-anchor="middle" font-size="12" fill="#0f766e">關鍵字描述</text>
<text x="170" y="208" text-anchor="middle" font-size="10.5" fill="#0f766e" font-style="italic">當作模擬使用者的隱藏人設</text>
<line x1="300" y1="170" x2="345" y2="170" stroke="#0d9488" stroke-width="2.2" stroke-dasharray="6,5" marker-end="url(#arrowTeal)"/>
<rect x="350" y="110" width="300" height="120" rx="16" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
<text x="500" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#831843">模擬使用者 Agent</text>
<text x="500" y="163" text-anchor="middle" font-size="11.5" fill="#9d174d">LLM 扮演，人設來自目標圖片的關鍵字</text>
<text x="500" y="183" text-anchor="middle" font-size="11.5" fill="#9d174d">先講模糊的一句話（刻意留未講的條件）</text>
<text x="500" y="205" text-anchor="middle" font-size="10.5" fill="#9d174d" font-style="italic">看結果後依落差給下一輪回饋</text>
<rect x="640" y="330" width="300" height="120" rx="16" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
<text x="790" y="368" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">系統本身</text>
<text x="790" y="392" text-anchor="middle" font-size="12.5" fill="#334155">ENGINE 01–03</text>
<text x="790" y="414" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">（跟 live demo 同一套程式碼）</text>
<text x="790" y="434" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">輸出：推薦圖片／生成圖片</text>
<rect x="60" y="330" width="300" height="120" rx="16" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
<text x="210" y="364" text-anchor="middle" font-size="16" font-weight="700" fill="#164e63">程式化評分者</text>
<text x="210" y="388" text-anchor="middle" font-size="12" fill="#155e75">FashionCLIP：輸出圖片 vs 目標圖片</text>
<text x="210" y="408" text-anchor="middle" font-size="12" fill="#155e75">embedding cosine similarity</text>
<text x="210" y="430" text-anchor="middle" font-size="10.5" fill="#0e7490" font-style="italic">（ENGINE01 專屬檢查另用結構化屬性比對）</text>
<line x1="610" y1="222" x2="770" y2="322" stroke="#db2777" stroke-width="2.3" marker-end="url(#arrowPink)"/>
<text x="625" y="270" font-size="12" fill="#9d174d">一句話／回饋</text>
<text x="625" y="286" font-size="12" fill="#9d174d">（含隱藏目標）</text>
<line x1="640" y1="410" x2="360" y2="410" stroke="#475569" stroke-width="2.3" marker-end="url(#arrowSlate)"/>
<text x="418" y="400" font-size="12" fill="#334155">輸出圖片</text>
<line x1="270" y1="330" x2="410" y2="222" stroke="#0891b2" stroke-width="2.3" marker-end="url(#arrowCyan)"/>
<text x="230" y="290" font-size="12" fill="#0e7490">與目標的落差</text>
<text x="230" y="306" font-size="12" fill="#0e7490">→ 驅動下一輪回饋</text>
<text x="500" y="300" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">每個目標跑 2–4 輪對話</text>
<rect x="330" y="500" width="340" height="210" rx="16" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
<text x="500" y="528" text-anchor="middle" font-size="15.5" font-weight="700" fill="#312e81">彙總量化指標</text>
<text x="500" y="554" text-anchor="middle" font-size="12" fill="#3730a3" font-weight="700">相似度隨輪數收斂（折線圖，最有說服力）</text>
<text x="500" y="576" text-anchor="middle" font-size="12" fill="#3730a3">符合度：回饋前 → 回饋後</text>
<text x="500" y="598" text-anchor="middle" font-size="12" fill="#3730a3">ENGINE 01 意圖抽取準確率</text>
<text x="500" y="620" text-anchor="middle" font-size="12" fill="#3730a3">NDCG@5（hybrid+rerank vs. 純關鍵字／純 embedding）</text>
<text x="500" y="644" text-anchor="middle" font-size="11" fill="#4338ca" font-style="italic">用於簡報／README 佐證</text>
<text x="500" y="666" text-anchor="middle" font-size="10.5" fill="#6366f1">重複 30–50 組不同目標圖片，取平均</text>
<text x="500" y="690" text-anchor="middle" font-size="10.5" fill="#6366f1">＝驗證兩種輸出（推薦＋生成）共用同一套分數</text>
<path d="M210,450 C 210,530 300,560 330,570" fill="none" stroke="#0891b2" stroke-width="2.3" marker-end="url(#arrowCyan)"/>
<text x="500" y="836" text-anchor="middle" font-size="11.5" fill="#b45309">⚠ Pinterest 原圖僅供內部計算相似度，不公開展示於 demo 或簡報</text>
</svg>