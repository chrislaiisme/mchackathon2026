# Sources for `python -m engine02.crawl --config scripts/crawl_sources.example.toml`.
# Every enabled stanza states what was verified and when. A source not listed here is not known to
# work -- add it and read report.json: the crawler says whether it completed or was stopped, and why.
# See docs/crawler.md.

[defaults]
delay_s = 3.0            # min seconds between two requests to the same host
max_pages = 40
cache_ttl_hours = 24

# ---- Wikimedia Commons (official API; every image carries its licence and author) --------------
# verified 2026-09-19: 5 records each from "Catwalks (fashion)" (CC BY 2.0) and "Cosplayers"
# (CC BY-SA 4.0), 0 errors. Attribution is required when displaying: see field_origin.license/author.
[[sources]]
name = "commons_runway"
type = "commons"
categories = ["Catwalks (fashion)", "Fashion shows"]
max_files = 300
depth = 2

[[sources]]
name = "commons_street"
type = "commons"
categories = ["Street fashion"]
max_files = 200
depth = 2

[[sources]]
name = "commons_cosplay"
type = "commons"
categories = ["Cosplayers", "Cosplay by clothing"]
max_files = 300
depth = 2
# default exclusions (skip files/subcats whose categories contain these words):
# exclude_categories = ["Lingerie shows", "Topless", "Nude", "Nudity", "Erotic", "Furry"]

# ---- Instagram (needs YOUR credentials or export; nothing runs without them) -----------------
# Direct page collection is not offered: instagram.com/robots.txt is "User-agent: * / Disallow: /"
# (verified 2026-09-19). Official API: set IG_ACCESS_TOKEN and IG_USER_ID in .env.
#
# [[sources]]
# name = "ig_brands"
# type = "instagram_api"
# mode = "business_discovery"
# usernames = ["somebrand"]
# max_posts = 200
#
# [[sources]]
# name = "ig_my_export"
# type = "instagram_export"
# path = "data/instagram_export"     # unzipped "Download your information" (JSON)

# ---- public web pages ------------------------------------------------------------------------
# (verified sites are appended below)

# ==== verified by a source-discovery pass on 2026-09-19 (robots.txt + one sample page per host) ====
[[sources]]
name = "pinkoi"
type = "web"
start_urls = ["https://www.pinkoi.com/product/z2LFEhJw", "https://www.pinkoi.com/browse?catp=group_0"]
allowed_domains = ["www.pinkoi.com"]
follow = ["^https://www\\.pinkoi\\.com/product/[A-Za-z0-9]+$", "/browse\\?catp="]
exclude = ["/(my|zoom|user|message|inv)/", "/(login|signin|register|account|member|cart|checkout|user|my)(/|\\?|$)", "\\?.*(sort|order_by|page)=", "\\.(jpg|png|webp|gif|pdf)$"]
