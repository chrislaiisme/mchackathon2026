# =====================================================================================================
# API_ONLY sources (commented out: engine02.crawl has no connector for these yet; each needs a credential)
# Web pages of every one of these are robots-disallowed or JS-only for our UA (see report).
# =====================================================================================================

# ---- Mastodon (no credential needed on mastodon.social) ----------------------------------------------
# verified 2026-09-19: GET https://mastodon.social/api/v1/timelines/tag/ootd?limit=3 -> 200 JSON, public
# statuses with media_attachments; robots.txt allows /api/. Docs: "View public statuses containing the given
# hashtag." / "Authentication may be required depending on instance settings." Rate limit: "300 times within
# 5 minutes per IP address". Params: only_media=true, limit<=40, max_id paging.
# -> implemented: see the "mastodon_fashion" stanza at the end of this file.

# ---- Bluesky (free app password) ----------------------------------------------------------------------
# verified 2026-09-19: GET https://public.api.bsky.app/xrpc/app.bsky.feed.searchPosts?q=%23ootd -> 403
# unauthenticated. Docs: "Clients may connect directly to the Bluesky AppView endpoints (https://api.bsky.app
# or https://public.api.bsky.app) for unauthenticated access." -- but searchPosts is refused there;
# use an authenticated session (BSKY_HANDLE + BSKY_APP_PASSWORD) against the user's PDS / api.bsky.app.
# [[sources]]
# name = "bluesky_ootd"
# type = "bluesky"
# query = "#ootd"
# max_posts = 200

# ---- Tumblr (free OAuth consumer key used as api_key) -----------------------------------------------------
# Web /tagged/ page is allowed by robots but JS-rendered (274 chars text). Docs: `api.tumblr.com/v2/tagged`
# GET, "API Key or OAuth"; "Use your OAuth Consumer Key as your `api_key`"; limits "1,000 API calls per hour,
# per consumer key" / "5,000 API calls per day, per consumer key"; limit 1-20 per call.
# [[sources]]
# name = "tumblr_fashion"
# type = "tumblr"
# api_key_env = "TUMBLR_API_KEY"
# tags = ["fashion", "ootd", "streetstyle"]

# ---- Reddit (OAuth client id/secret; free for non-commercial) ---------------------------------------------
# www.reddit.com/robots.txt: "User-agent: *  Disallow: /". Reddit Data API: OAuth required, 100 QPM per
# client id (Data API Wiki; help page returned 403 to our fetcher, figure taken from secondary summaries).
# Endpoint: GET https://oauth.reddit.com/r/malefashionadvice/new (posts + preview.images).
# [[sources]]
# name = "reddit_mfa"
# type = "reddit"
# subreddits = ["malefashionadvice", "femalefashionadvice", "streetwear", "OUTFITS"]

# ---- YouTube Data API v3 (free API key) --------------------------------------------------------------------
# www.youtube.com/robots.txt disallows /results. Quota page (fetched 2026-09-19): "10,000 units per day combined
# for all other endpoints" plus "100 search.list calls" per day. search.list?q=ootd&type=video -> thumbnails.
# [[sources]]
# name = "youtube_ootd"
# type = "youtube"
# api_key_env = "YOUTUBE_API_KEY"

# ---- Flickr (free non-commercial API key) ------------------------------------------------------------------
# www.flickr.com/robots.txt "User-agent: *  Disallow: /". flickr.photos.search(tags=streetstyle,
# extras=url_m,license) -- "unauthenticated calls return only public photos" (still needs api_key);
# "stays under 3600 queries per hour across the whole key". Prefer license filter for CC photos.
# [[sources]]
# name = "flickr_streetstyle"
# type = "flickr"
# api_key_env = "FLICKR_API_KEY"
# tags = ["streetstyle", "ootd"]

# ---- Threads (Meta app + app review) -----------------------------------------------------------------------
# www.threads.com/robots.txt "User-agent: *  Disallow: /". GET graph.threads.net/v1.0/keyword_search needs
# threads_keyword_search: "If your app has not been approved for the threads_keyword_search permission, the
# search will be performed only on posts owned by the authenticated user." Limit 2,200 queries / 24 h.

# ---- X (paid) ----------------------------------------------------------------------------------------------
# x.com/robots.txt "User-agent: *  Disallow: /". X API is "pay-per-usage": "$0.005 per resource" for post reads;
# no free read tier found in the pricing page. Not recommended for a demo.

# ---- Pinterest (OAuth, only your own pins) -------------------------------------------------------------------
# www.pinterest.com/robots.txt "User-agent: *  Disallow: /". API v5 List Pins "retrieves all Pins owned by the
# operation user account" (pins:read, boards:read). No public hashtag search found in v5 docs.

# ---- Instagram (already handled by engine02.crawl.instagram: IG_ACCESS_TOKEN + IG_USER_ID) ------------------
# www.instagram.com/robots.txt "User-agent: *  Disallow: /" (re-verified 2026-09-19).

# ---- Mastodon public hashtag timelines (no key) -------------------------------------------------------------
# GET https://{instance}/api/v1/timelines/tag/{tag}?limit=40&only_media=true&max_id=... (docs.joinmastodon.org).
# Documented limit: 300 requests / 5 min per IP. robots.txt is checked for the API path; sensitive posts and
# posts with a content warning (spoiler_text) are skipped and counted in the report.
[[sources]]
name = "mastodon_fashion"
type = "mastodon"
instances = ["mastodon.social"]
hashtags = ["ootd", "fashion", "streetstyle", "穿搭"]
max_posts = 200
only_media = true
delay_s = 1.0
